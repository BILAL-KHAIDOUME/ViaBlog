<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="output.css">
    <link href="https://fonts.googleapis.com/css2?family=Inika&display=swap" rel="stylesheet">

</head>
<body class="flex flex-col items-center justify-center">

    <div id="maincontainer" class=" hidden fixed inset-0 bg-gray-500 bg-opacity-70 z-10 hidden">

        <div  class="bg-white p-6 rounded-2xl w-[60%] max-w-md mx-auto">
            <div class="flex items-center justify-center">

                <h1 class="font-bold font-inika text-black">Add card</h1>
            </div>
            <form id="cardsform" action="#" method="post" class="flex flex-col gap-[10px] relative">
                <label for="titre" class="mx-[50px] font-bold font-inika">Titre : </label>
                <input id="titre" type="text" name="titre" class="mx-[50px] rounded-2xl py-[5px] bg-gray-300" required>
    
                <label for="destination" class="mx-[50px] font-bold font-inika">Destination : </label>
                <input id="destination" type="text" name="destination" class="mx-[50px] rounded-2xl py-[5px] bg-gray-300" required>
    
                <label for="note" class="mx-[50px] font-bold font-inika">Note : </label>
                <input id="note" type="text" name="note" class="mx-[50px] rounded-2xl py-[5px] bg-gray-300" required>
    
                <label for="category" class="mx-[50px] font-bold font-inika">Category : </label>
                <input id="category" type="text" name="category" class="mx-[50px] rounded-2xl py-[5px] bg-gray-300" required>
    
                <label for="image" class="mx-[50px] font-bold font-inika">Image url : </label>
                <input id="image" type="url" name="image" class="mx-[50px] rounded-2xl py-[5px] bg-gray-300" required>
    
                <div class="flex justify-center items-center gap-[30px] mb-[10px]">
                    <button type="reset" class="px-[20px] py-[10px] bg-gray-500 rounded-2xl" id="cancelbtn">Cancel</button>
                    <button type="submit" class="px-[20px] py-[10px] bg-green-500 rounded-2xl" >Submit</button>
                </div>
    </div>
        
        </form>
    </div>

    

<button id="addbtn" class="bg-blue-600 text-white px-4 py-2 rounded">ADD CARD</button>

<div id="cardContainer" class="flex flex-wrap gap-6 mt-6 justify-center">
    
</div>

<script>
    let addcard = document.getElementById("addbtn");
    let maincontainer = document.getElementById("maincontainer");
    let cancelbtn = document.getElementById("cancelbtn");
    let cardsform = document.getElementById("cardsform");
    let cardContainer = document.getElementById("cardContainer");


     addcard.addEventListener("click", () => {
        maincontainer.classList.remove("hidden");
    });


    cancelbtn.addEventListener("click", () => {
        maincontainer.classList.add("hidden");
    });


    cardsform.addEventListener('submit', (event) => {
        event.preventDefault();


        const titre = document.getElementById('titre').value;
        const destination = document.getElementById('destination').value;
        const note = document.getElementById('note').value;
        const category = document.getElementById('category').value;
        const image = document.getElementById('image').value;


        const newCard = document.createElement('div');
        newCard.classList.add('bg-white', 'p-4', 'rounded-lg', 'shadow-lg', 'w-[300px]', 'h-[400px]', 'flex', 'flex-col', 'items-center');
        newCard.innerHTML = `
            <img src="${image}" alt="${titre}" class="w-full h-40 object-cover rounded-lg mb-4">
            <h2 class="text-xl font-bold mb-2">${titre}</h2>
            <p class="text-gray-700">Destination: ${destination}</p>
            <p class="text-gray-700">Note: ${note}</p>
            <p class="text-gray-700">Category: ${category}</p>
        `;

        cardContainer.appendChild(newCard);

        maincontainer.classList.add('hidden');

      
        cardsform.reset();
    });
</script>


    
</body>
</html>
